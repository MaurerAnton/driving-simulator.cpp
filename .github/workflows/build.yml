name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build zlib1g-dev libpng-dev libegl-dev libgles-dev
      - name: Build and test
        run: FS_JOBS=4 tools/check.sh

  web:
    name: WebAssembly build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Packages
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - name: Build
        run: |
          emcmake cmake -S . -B build-web -G Ninja
          cmake --build build-web
          ls -la build-web/site
      - name: The site as an artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-web/site

  deploy:
    name: Publish the test site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
